tags: [Contacts]
summary: Patch contact
operationId: patchContact
description: Updates selected contact properties
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string }
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name: { type: string }
          phoneNumber: { type: string }
          email: { type: string }
          isFavourite: { type: boolean }
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a contact!
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status: { type: integer, example: 200 }
            message: { type: string, example: Successfully patched a contact! }
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
