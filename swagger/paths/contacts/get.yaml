tags: [Contacts]
summary: Get contacts list (paginated)
operationId: getContacts
description: Returns a paginated list of contacts for the currently logged in user.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer, minimum: 1, default: 1 }
  - in: query
    name: perPage
    schema: { type: integer, minimum: 1, default: 10 }
  - in: query
    name: sortBy
    schema: { type: string, default: name }
    description: Property for sort
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
  - in: query
    name: isFavourite
    schema: { type: boolean }
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page: { type: integer, example: 1 }
                perPage: { type: integer, example: 10 }
                totalItems: { type: integer, example: 42 }
                totalPages: { type: integer, example: 5 }
                hasPreviousPage: { type: boolean, example: false }
                hasNextPage: { type: boolean, example: true }
  '401':
    $ref: '../../components/responses/401.yaml'
